name: Kwartierprijzen ophalen
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "trigger/**"
permissions:
  contents: write
concurrency:
  group: prijzen
  cancel-in-progress: false
jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prijzen ophalen
        id: prijzen
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: node scripts/fetch_prices.mjs
      - name: Laadsessies ophalen (Smappee)
        continue-on-error: true
        env:
          SMAPPEE_CLIENT_ID: ${{ secrets.SMAPPEE_CLIENT_ID }}
          SMAPPEE_CLIENT_SECRET: ${{ secrets.SMAPPEE_CLIENT_SECRET }}
          SMAPPEE_USERNAME: ${{ secrets.SMAPPEE_USERNAME }}
          SMAPPEE_PASSWORD: ${{ secrets.SMAPPEE_PASSWORD }}
          SMAPPEE_LOCATION_ID: ${{ secrets.SMAPPEE_LOCATION_ID }}
        run: node scripts/fetch_charging.mjs
      - name: Opslaan als er iets veranderd is
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Geen wijziging."
          else
            git config user.name "prijzen-bot"
            git config user.email "prijzen-bot@users.noreply.github.com"
            git add data
            git commit -m "Gegevens bijgewerkt"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
      - name: Fout melden als de prijzen ontbraken
        if: steps.prijzen.outcome == 'failure'
        run: exit 1
