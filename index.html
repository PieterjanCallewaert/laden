<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Laden</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Laden">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#fbfaf7;--ink:#16160f;--muted:#86857d;--grid:#e7e6df;--good:#17986a;--bad:#e2602a;--goodbg:#dcf2e8;--badbg:#fbe4d8;--net:#2a78d6;--sun:#d9a400}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--ink:#f1f0ea;--muted:#8f8e86;--grid:#2b2b28;--good:#35b98a;--bad:#f0794a;--goodbg:#15382b;--badbg:#452316;--net:#5a9aee;--sun:#f0c23a}}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:15px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) env(safe-area-inset-right) max(6px,env(safe-area-inset-bottom)) env(safe-area-inset-left)}
#read{flex:none;height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px 0 12px}
#when{font-size:12px;white-space:nowrap;color:var(--muted);font-weight:600;letter-spacing:.02em}
#price{font-size:26px;font-weight:680;letter-spacing:-.01em;white-space:nowrap}
#price small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
#chip{flex:none;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:650;white-space:nowrap;text-align:right}
#chip.good{background:var(--goodbg);color:var(--good)}#chip.bad{background:var(--badbg);color:var(--bad)}#chip.none{color:var(--muted);font-weight:500}
#nav{flex:none;height:40px;display:flex;align-items:center;justify-content:center;gap:4px}
#nav button{appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--ink);font:inherit;padding:0;margin:0}
#nav .arr{width:56px;height:40px;font-size:26px;line-height:1;font-weight:500}
#nav .arr:disabled{opacity:.18}
#dayb{min-width:132px;height:40px;font-size:15px;font-weight:650}
#chart{flex:1;position:relative;min-height:0;touch-action:none}
#plot{position:absolute;inset:0;width:100%;height:100%}
svg{display:block}
svg text{font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--muted)}
svg text.day{font-weight:650;font-size:12px;fill:var(--ink)}
svg text.thr{font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
svg text.wait{font-size:13px}
svg text.demo{font-size:34px;font-weight:800;fill:var(--muted);opacity:.22;letter-spacing:.08em}
</style>
</head>
<body>
<div id="app">
  <div id="read"><div><div id="when">&nbsp;</div><div id="price">&nbsp;</div></div><div id="chip" class="none"></div></div>
  <div id="nav"><button class="arr" id="prev" aria-label="Vorige dag">‹</button><button id="dayb"></button><button class="arr" id="next" aria-label="Volgende dag">›</button></div>
  <div id="chart"><svg id="plot"></svg></div>
</div>
<script>
"use strict";
var TZ = "Europe/Brussels", QMS = 900000;
var DEFAULT_TARIFFS = {"bijgewerkt":"2026-11-11","ecopower":{"factor_per_eur_mwh":0.00102,"toeslag_eur_kwh":0.004,"gsc_eur_kwh":0.011,"wkk_eur_kwh":0.00392,"afnametarief_eur_kwh":0.0553921,"bijzondere_accijns_eur_kwh":0.046,"bijdrage_op_de_energie_eur_kwh":0,"btw":0.06},"creg_vlaams_gewest_eur_kwh":{"2026-Q3":0.3222,"2026-Q4":0.3225,"2027-Q1":0.3616}};
var S = { tariffs: DEFAULT_TARIFFS, days: {}, chg: {}, sel: null, demo: /[?&]demo=1/.test(location.search), lastDirect: 0, geo: null, view: null };

var partsFmt = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
function bxl(ms) { var o = {}; partsFmt.formatToParts(new Date(ms)).forEach(function (p) { o[p.type] = p.value; }); return { date: o.year + "-" + o.month + "-" + o.day, h: +o.hour, m: +o.minute }; }
var dayLabelFmt = new Intl.DateTimeFormat("nl-BE", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });
var wdFmt = new Intl.DateTimeFormat("nl-BE", { timeZone: TZ, weekday: "short" });
function addDays(d, n) { var x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function pad(n) { return String(n).padStart(2, "0"); }
function hhmm(ms) { var b = bxl(ms); return pad(b.h) + ":" + pad(b.m); }
function n0(v) { return Math.round(v).toLocaleString("nl-BE"); }
function n1(v) { return Math.abs(v).toLocaleString("nl-BE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function el(id) { return document.getElementById(id); }

/* ---- rekenmodel: kost per kWh = a x marktprijs + b ; omslagprijs = (CREG - b) / a ---- */
function quarterKey(day) { return day.slice(0, 4) + "-Q" + (Math.floor((+day.slice(5, 7) - 1) / 3) + 1); }
function creg(day) { var t = S.tariffs.creg_vlaams_gewest_eur_kwh, k = quarterKey(day); if (t[k] != null) return t[k]; var keys = Object.keys(t).sort(); return t[keys[keys.length - 1]]; }
function model() { var e = S.tariffs.ecopower, k = 1 + e.btw; return { a: k * e.factor_per_eur_mwh, b: k * (e.toeslag_eur_kwh + e.gsc_eur_kwh + e.wkk_eur_kwh + e.afnametarief_eur_kwh + e.bijzondere_accijns_eur_kwh + e.bijdrage_op_de_energie_eur_kwh) }; }
function threshold(day) { var m = model(); return (creg(day) - m.b) / m.a; }
function marginCt(day, P) { var m = model(); return (creg(day) - (m.a * P + m.b)) * 100; }

/* ---- gegevens ---- */
function setDays(obj) { var out = {}; Object.keys(obj || {}).forEach(function (d) { var a = obj[d]; if (Array.isArray(a) && a.length >= 92) out[d] = a.map(function (x) { return { t: x[0] * 1000, p: x[1] }; }); }); return out; }
function dayStartMs(day) { var ms = Date.UTC(+day.slice(0, 4), +day.slice(5, 7) - 1, +day.slice(8, 10)) - 3 * 3600000; for (var i = 0; i < 96; i++) { var b = bxl(ms); if (b.date === day && b.h === 0 && b.m === 0) return ms; ms += QMS; } return ms; }
function demoDay(day) {
  var seed = 0; for (var i = 0; i < day.length; i++) seed = (seed * 31 + day.charCodeAt(i)) % 1000;
  var shift = (seed % 7) * 6 - 10, ms = dayStartMs(day), out = [];
  while (bxl(ms).date === day) { var b = bxl(ms), h = b.h + b.m / 60;
    var p = 108 + shift + 85 * Math.exp(-Math.pow((h - 8) / 1.6, 2)) + 135 * Math.exp(-Math.pow((h - 18.7) / 2, 2)) - 60 * Math.exp(-Math.pow((h - 13) / 3, 2)) - 28 * Math.exp(-Math.pow((h - 3) / 2.5, 2)) + Math.sin(ms / QMS * 1.7) * 8;
    out.push({ t: ms, p: Math.round(p * 10) / 10 }); ms += QMS; }
  return out;
}
async function getJSON(u) { var r = await fetch(u + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
async function directDay(day) {
  var r = await fetch("https://api.energy-charts.info/price?bzn=BE&start=" + day + "&end=" + addDays(day, 1), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  var j = await r.json(), s = [];
  for (var i = 0; i < j.unix_seconds.length; i++) { var ms = j.unix_seconds[i] * 1000; if (j.price[i] != null && bxl(ms).date === day) s.push({ t: ms, p: j.price[i] }); }
  if (s.length > 1 && s[1].t - s[0].t >= 3500000) { var ex = []; s.forEach(function (x) { for (var k = 0; k < 4; k++) ex.push({ t: x.t + k * QMS, p: x.p }); }); s = ex; }
  if (s.length < 92) throw new Error("onvolledig"); return s;
}
async function load() {
  var today = bxl(Date.now()).date, tomorrow = addDays(today, 1);
  try { var t = await getJSON("tariffs.json"); if (t && t.ecopower && t.creg_vlaams_gewest_eur_kwh) { S.tariffs = t; lsSet("ld_tariffs", JSON.stringify(t)); } }
  catch (e) { var c = lsGet("ld_tariffs"); if (c) try { S.tariffs = JSON.parse(c); } catch (x) {} }
  if (S.demo) { S.days = {}; S.days[today] = demoDay(today); S.days[tomorrow] = demoDay(tomorrow); return; }
  try { var cj = await getJSON("data/charging.json"), cm = {}; Object.keys(cj.days || {}).forEach(function (d) { var m = {}; cj.days[d].forEach(function (x) { m[x[0] * 1000] = { ev: x[1], net: x[2] }; }); cm[d] = m; }); S.chg = cm; } catch (e) {}
  var days = {};
  try { var p = await getJSON("data/prices.json"); days = setDays(p.days); if (Object.keys(days).length) lsSet("ld_prices", JSON.stringify(p.days)); } catch (e) {}
  if (!days[today] || !days[tomorrow]) { var c2 = lsGet("ld_prices"); if (c2) try { var old = setDays(JSON.parse(c2)); [today, tomorrow].forEach(function (d) { if (!days[d] && old[d]) days[d] = old[d]; }); } catch (x) {} }
  /* reserve: rechtstreeks bij de bron, als het eigen bestand achterloopt */
  var need = []; if (!days[today]) need.push(today); if (!days[tomorrow] && bxl(Date.now()).h >= 13) need.push(tomorrow);
  if (need.length && Date.now() - S.lastDirect > 600000) { S.lastDirect = Date.now();
    for (var i = 0; i < need.length; i++) { try { days[need[i]] = await directDay(need[i]); } catch (e) {} } }
  S.days = days;
}

/* ---- tekenen ---- */
function niceStep(raw) { var c = [10, 20, 25, 50, 100, 200, 250, 500, 1000]; for (var i = 0; i < c.length; i++) if (c[i] >= raw) return c[i]; return 2000; }
function nowSlot() { var now = Date.now(), d = bxl(now).date, s = S.days[d]; if (!s) return null; for (var i = 0; i < s.length; i++) if (now >= s[i].t && now < s[i].t + QMS) return { day: d, i: i }; return null; }

function render() {
  var box = el("chart"), plot = el("plot"), W = box.clientWidth, H = box.clientHeight;
  var today = bxl(Date.now()).date, tomorrow = addDays(today, 1), all = Object.keys(S.days).sort();
  var first = all.length && all[0] < today ? all[0] : today;
  if (!S.view || S.view > tomorrow || S.view < first) S.view = today;
  var days = [S.view];
  el("dayb").textContent = (S.view === today ? "vandaag · " : S.view === tomorrow ? "morgen · " : "") + dayLabelFmt.format(new Date(dayStartMs(S.view) + 12 * 3600000)).replace(".", "");
  el("prev").disabled = S.view <= first; el("next").disabled = S.view >= tomorrow;
  if (W < 50 || H < 80) { plot.innerHTML = ""; S.geo = null; return; }
  var side = false, pw = W, ph = H, AX = 34, T = 12, B = 52;
  var lo = 0, hi = 50;
  days.forEach(function (d) { hi = Math.max(hi, threshold(d) * 1.1); (S.days[d] || []).forEach(function (s) { if (s.p < lo) lo = s.p; if (s.p > hi) hi = s.p; }); });
  var ns = niceStep((hi - lo) / (ph > 260 ? 4.5 : 3)); lo = Math.floor(lo / ns) * ns; hi = Math.ceil(hi / ns) * ns;
  var now = Date.now(), ns0 = nowSlot(), g = "", geo = [];
  days.forEach(function (d, k) {
    var px = side ? k * pw : 0, py = side ? 0 : k * ph, x0 = px + AX, iw = pw - AX - (side && k === 0 ? 6 : 2), ih = ph - T - B, yb = py + T + ih;
    var y = function (v) { return py + T + ih * (1 - (v - lo) / (hi - lo)); };
    var s = S.days[d], thr = threshold(d), mid = dayStartMs(d) + 12 * 3600000;
    for (var v = lo; v <= hi + 0.01; v += ns) g += '<line x1="' + x0 + '" x2="' + (x0 + iw) + '" y1="' + y(v) + '" y2="' + y(v) + '" style="stroke:var(--grid)" stroke-width="' + (v === 0 ? 1.5 : 1) + '"/><text x="' + (x0 - 5) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + n0(v) + "</text>";
    if (!s) {
      g += '<text class="wait" x="' + (x0 + iw / 2) + '" y="' + (py + T + ih / 2) + '" text-anchor="middle">' + (d > today ? "prijzen volgen rond 13 uur" : "geen prijzen") + "</text>";
      for (var hh = 0; hh < 24; hh += 3) g += '<text x="' + (x0 + iw * hh / 24).toFixed(1) + '" y="' + (yb + 31) + '" text-anchor="' + (hh === 0 ? "start" : "middle") + '">' + pad(hh) + "</text>";
    } else {
      var bw = iw / s.length, gap = bw > 3 ? 0.8 : 0.3;
      geo.push({ day: d, x0: x0, x1: x0 + iw, y0: py, y1: py + ph, bw: bw, n: s.length });
      s.forEach(function (sl, i) {
        var x = x0 + i * bw + gap / 2, w = bw - gap, yz = y(0), y1 = y(sl.p), top = Math.min(yz, y1), h = Math.max(1.5, Math.abs(yz - y1));
        var past = d === today && sl.t + QMS <= now, isSel = S.sel && S.sel.day === d && S.sel.i === i;
        g += '<rect x="' + x.toFixed(2) + '" y="' + top.toFixed(2) + '" width="' + w.toFixed(2) + '" height="' + h.toFixed(2) + '" rx="' + Math.min(1.5, w / 2).toFixed(2) + '" style="fill:var(' + (sl.p <= thr ? "--good" : "--bad") + ')" opacity="' + (isSel ? 1 : past ? 0.3 : 0.92) + '"/>';
        var cg = S.chg[d] && S.chg[d][sl.t]; if (cg) g += '<rect x="' + (x0 + i * bw).toFixed(2) + '" y="' + (yb + 4) + '" width="' + (bw + 0.3).toFixed(2) + '" height="13" style="fill:var(' + (cg.net >= cg.ev / 2 ? "--net" : "--sun") + ')"/>';
        var b = bxl(sl.t); if (b.m === 0 && b.h % 3 === 0) g += '<text x="' + (x0 + i * bw).toFixed(1) + '" y="' + (yb + 31) + '" text-anchor="' + (b.h === 0 ? "start" : "middle") + '">' + pad(b.h) + "</text>";
      });
      if (ns0 && ns0.day === d) { var xn = x0 + (ns0.i + 0.5) * bw; g += '<line x1="' + xn + '" x2="' + xn + '" y1="' + (py + T - 5) + '" y2="' + yb + '" style="stroke:var(--ink)" stroke-width="1.4"/><circle cx="' + xn + '" cy="' + (py + T - 5) + '" r="3" style="fill:var(--ink)"/>'; }
      if (S.sel && S.sel.day === d) { var xs = x0 + (S.sel.i + 0.5) * bw, ys = y(s[S.sel.i].p); g += '<line x1="' + xs + '" x2="' + xs + '" y1="' + (py + T - 5) + '" y2="' + yb + '" style="stroke:var(--ink)" stroke-width="1" stroke-dasharray="2 3"/><circle cx="' + xs + '" cy="' + ys + '" r="4.5" style="fill:var(--bg);stroke:var(--ink)" stroke-width="2"/>'; }
    }
    var cd = S.chg[d], ln = null, lz = null;
    if (S.sel && S.sel.day === d && s && cd && cd[s[S.sel.i].t]) { var c1 = cd[s[S.sel.i].t]; ln = c1.net; lz = c1.ev - c1.net; }
    else if (cd && !(S.sel && S.sel.day === d)) { ln = 0; lz = 0; Object.keys(cd).forEach(function (k2) { ln += cd[k2].net; lz += cd[k2].ev - cd[k2].net; }); }
    var t1 = "geladen uit het net" + (ln != null ? " " + n1(ln / 1000) + " kWh" : ""), t2 = "op zon" + (lz != null ? " " + n1(lz / 1000) + " kWh" : "");
    var w1 = 19 + t1.length * 6.1, w2 = 19 + t2.length * 6.1, lx = x0 + Math.max(0, (iw - w1 - w2 - 16) / 2), ly = yb + 47;
    g += '<rect x="' + lx + '" y="' + (ly - 9) + '" width="14" height="10" rx="1.5" style="fill:var(--net)"/><text x="' + (lx + 19) + '" y="' + ly + '">' + t1 + '</text><rect x="' + (lx + w1 + 16) + '" y="' + (ly - 9) + '" width="14" height="10" rx="1.5" style="fill:var(--sun)"/><text x="' + (lx + w1 + 35) + '" y="' + ly + '">' + t2 + "</text>";
    g += '<line x1="' + x0 + '" x2="' + (x0 + iw) + '" y1="' + y(thr) + '" y2="' + y(thr) + '" style="stroke:var(--ink)" stroke-width="1.6" stroke-dasharray="5 4"/>';
    g += '<text class="thr" x="' + (x0 + iw - 3) + '" y="' + (y(thr) - 6) + '" text-anchor="end">' + n0(thr) + "</text>";
    if (S.demo) g += '<text class="demo" x="' + (x0 + iw / 2) + '" y="' + (py + T + ih * 0.3) + '" text-anchor="middle">VOORBEELD</text>';
  });
  plot.setAttribute("viewBox", "0 0 " + W + " " + H); plot.innerHTML = g; S.geo = geo;
  readout();
}

function readout() {
  var when = el("when"), price = el("price"), chip = el("chip"), today = bxl(Date.now()).date;
  var cur = S.sel || (S.view === today ? nowSlot() : null), s = S.days[S.view], P, day = S.view;
  if (cur && S.days[cur.day] && S.days[cur.day][cur.i]) {
    var sl = S.days[cur.day][cur.i]; P = sl.p; day = cur.day;
    when.textContent = (S.sel ? "" : "nu · ") + hhmm(sl.t) + "–" + hhmm(sl.t + QMS);
  } else if (s) { P = s.reduce(function (a, x) { return a + x.p; }, 0) / s.length; when.textContent = "daggemiddelde"; }
  else { when.innerHTML = "&nbsp;"; price.innerHTML = "–"; chip.className = "none"; chip.textContent = ""; return; }
  var m = marginCt(day, P), ok = m >= 0;
  price.innerHTML = n0(P) + "<small>€/MWh</small>";
  chip.className = ok ? "good" : "bad";
  chip.textContent = (ok ? "thuis · +" : "publiek · −") + n1(m) + " ct/kWh";
}

var selTimer = null, raf = 0;
function pick(ev) {
  if (!S.geo || !S.geo.length) return; var r = el("chart").getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, best = null;
  S.geo.forEach(function (p) { if (y >= p.y0 && y < p.y1 && x >= p.x0 - 40 && x <= p.x1 + 10) best = p; });
  if (!best) return; var i = Math.min(best.n - 1, Math.max(0, Math.floor((x - best.x0) / best.bw)));
  if (S.sel && S.sel.day === best.day && S.sel.i === i) return;
  S.sel = { day: best.day, i: i }; if (!raf) raf = requestAnimationFrame(function () { raf = 0; render(); });
}
function release() { clearTimeout(selTimer); selTimer = setTimeout(function () { S.sel = null; render(); }, 6000); }
var chartEl = el("chart"), down = false;
chartEl.addEventListener("pointerdown", function (e) { down = true; clearTimeout(selTimer); try { chartEl.setPointerCapture(e.pointerId); } catch (x) {} pick(e); e.preventDefault(); });
chartEl.addEventListener("pointermove", function (e) { if (down || e.pointerType === "mouse") { clearTimeout(selTimer); pick(e); } });
["pointerup", "pointercancel", "pointerleave"].forEach(function (n) { chartEl.addEventListener(n, function () { down = false; if (S.sel) release(); }); });
document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
function go(n) { clearTimeout(selTimer); S.sel = null; S.view = n === 0 ? bxl(Date.now()).date : addDays(S.view, n); render(); }
el("prev").addEventListener("click", function () { go(-1); }); el("next").addEventListener("click", function () { go(1); }); el("dayb").addEventListener("click", function () { go(0); });
el("read").addEventListener("click", function () { clearTimeout(selTimer); S.sel = null; render(); });

async function refresh() { await load(); render(); }
function relayout() { render(); setTimeout(render, 250); }
window.addEventListener("resize", relayout); window.addEventListener("orientationchange", relayout);
if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(el("chart"));
document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
setInterval(function () { if (!document.hidden) refresh(); }, 300000);
setInterval(function () { if (!document.hidden) render(); }, 60000);
refresh();
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
